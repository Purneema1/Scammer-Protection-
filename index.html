    <script>
      // Suppress Vite dev server WebSocket disconnect notifications in cloud iframe preview
      (function() {
        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var str = (msg || '') + ' ' + (error ? (error.stack || error.message || '') : '');
          if (/websocket/i.test(str) || /@vite\/client/i.test(str)) {
            return true; // suppresses the error
          }
          if (origOnError) return origOnError.apply(this, arguments);
          return false;
        };
        window.addEventListener('error', function(event) {
          var text = (event.message || '') + ' ' + (event.error ? (event.error.stack || event.error.message || '') : '');
          if (/websocket/i.test(text) || /@vite\/client/i.test(text)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = '' + (event.reason ? (event.reason.stack || event.reason.message || event.reason) : '');
          if (/websocket/i.test(reason) || /@vite\/client/i.test(reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
