<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="scamlyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="scamlyShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c172b" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <path
    d="M64 8 L114 26 C114 74 64 116 64 120 C64 116 14 74 14 26 Z"
    fill="url(#scamlyShieldBg)"
    stroke="url(#scamlyGrad)"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Subtle Cyber Grid Accent -->
  <path
    d="M64 20 L64 108 M30 50 L98 50 M22 75 L106 75"
    stroke="#06b6d4"
    stroke-opacity="0.18"
    stroke-width="2"
  />

  <!-- Stylized Modern "S" Cyber Emblem -->
  <path
    d="M78 38 C74 34 68 32 62 32 C50 32 42 39 42 49 C42 61 54 65 66 69 C78 73 86 78 86 88 C86 99 76 106 62 106 C50 106 42 100 38 92"
    fill="none"
    stroke="url(#scamlyGrad)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Core Security Spark / Pulse Dot -->
  <circle cx="92" cy="36" r="4.5" fill="#34d399" />
  <circle cx="36" cy="94" r="3.5" fill="#22d3ee" />
</svg>
