<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#111d35" />
      <stop offset="100%" stop-color="#070c17" />
    </linearGradient>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="pwaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas for Maskable / Standalone -->
  <rect width="512" height="512" rx="100" fill="#080e1a" />
  <circle cx="256" cy="256" r="230" fill="url(#cyberGlow)" />

  <!-- Shield Base -->
  <g filter="url(#pwaShadow)">
    <path
      d="M256 52 L420 114 C420 286 256 438 256 452 C256 438 92 286 92 114 Z"
      fill="url(#shieldFill)"
      stroke="url(#pwaGrad)"
      stroke-width="14"
      stroke-linejoin="round"
    />

    <!-- Inner Circuit Detail -->
    <path
      d="M256 90 L256 414 M140 200 L372 200 M114 290 L398 290"
      stroke="#22d3ee"
      stroke-opacity="0.15"
      stroke-width="4"
    />

    <!-- Iconic Stylized Scamly 'S' -->
    <path
      d="M312 165 C295 150 270 142 245 142 C196 142 165 170 165 210 C165 258 214 274 262 290 C310 306 342 326 342 366 C342 410 302 438 245 438 C198 438 165 414 150 382"
      fill="none"
      stroke="url(#pwaGrad)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- AI Security Nodes -->
    <circle cx="360" cy="155" r="16" fill="#34d399" />
    <circle cx="152" cy="388" r="14" fill="#22d3ee" />
    <circle cx="256" cy="236" r="8" fill="#a7f3d0" />
    <circle cx="256" cy="344" r="8" fill="#67e8f9" />
  </g>
</svg>
